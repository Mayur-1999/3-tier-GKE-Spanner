name: Service Mesh Deploy
on:
  workflow_dispatch:

jobs:
  Install-Istio-Dev:
    name: 'Verify Dev Deployment: ${{ inputs.app_name }}'
    runs-on: self-hosted
    defaults:
      run:
        shell: bash
    if: github.ref == 'refs/heads/Dev'
    environment:
     name: Dev_Env
    steps:

    - name: Download Artifacts
      uses: dawidd6/action-download-artifact@v8
      with:
        workflow: servicemesh_ci.yaml
        github_token: ${{ github.token }}
        repo: ${{ github.repository }}
        name: Istio-Artifacts
        path: Istio-Artifacts
    
    - name: Environment
      run: |
          echo "${{ vars.PROJECT_ID }}"
          echo "${{ vars.GKE_CLUSTER_NAME }}"
    
    - name: Setup Gcloud CLI
      uses: google-github-actions/setup-gcloud@94337306dda8180d967a56932ceb4ddcf01edae7
      with:
        service_account_key: ${{ secrets.GKE_SA_KEY }}
        project_id: ${{ vars.PROJECT_ID }}  

    - name: GKE-Gcloud Auth setup
      run: |
          gcloud --quiet auth configure-docker
          gcloud components install gke-gcloud-auth-plugin
          gke-gcloud-auth-plugin --version
          gcloud config set project "${{vars.PROJECT_ID}}"
          gcloud container clusters get-credentials "${{vars.GKE_CLUSTER_NAME}}" --region="${{vars.GKE_ZONE}}"

    - name: Install Istio
      run: |
          ls 
          cd Istio-Artifacts
          export PATH=$PWD/bin:$PATH
          chmod +x bin/istioctl
          istioctl install --set profile="default" -y
          kubectl label namespace default istio-injection=enabled
    
    - name: Install prometheus
      run: |
         kubectl apply -f Istio-Artifacts/prometheus.yaml

    - name: Install Grafana
      run: |
         kubectl apply -f Istio-Artifacts/grafana.yaml

    - name: Install Kiali
      run: |
         kubectl apply -f Istio-Artifacts/kiali.yaml

  Install-Istio-Test:
    name: 'Verify Test Deployment: ${{ inputs.app_name }}'
    runs-on: self-hosted
    defaults:
      run:
        shell: bash
    if: github.ref == 'refs/heads/Test'
    environment:
     name: Test_Env
    steps:

    - name: Download Artifacts
      uses: dawidd6/action-download-artifact@v8
      with:
        workflow: servicemesh_ci.yaml
        github_token: ${{ github.token }}
        repo: ${{ github.repository }}
        name: Istio-Artifacts
        path: Istio-Artifacts
    
    - name: Environment
      run: |
          echo "${{ vars.PROJECT_ID }}"
          echo "${{ vars.GKE_CLUSTER_NAME }}"
    
    - name: Setup Gcloud CLI
      uses: google-github-actions/setup-gcloud@94337306dda8180d967a56932ceb4ddcf01edae7
      with:
        service_account_key: ${{ secrets.GKE_SA_KEY }}
        project_id: ${{ vars.PROJECT_ID }}  

    - name: GKE-Gcloud Auth setup
      run: |
          gcloud --quiet auth configure-docker
          gcloud components install gke-gcloud-auth-plugin
          gke-gcloud-auth-plugin --version
          gcloud config set project "${{vars.PROJECT_ID}}"
          gcloud container clusters get-credentials "${{vars.GKE_CLUSTER_NAME}}" --region="${{vars.GKE_ZONE}}"

    - name: Install Istio
      run: |
          export PATH=$PWD/bin:$PATH
          istioctl install -f Istio-Artifacts/istio.yaml -y
          kubectl label namespace default istio-injection=enabled
    
    - name: Install prometheus
      run: |
         istioctl install -f Istio-Artifacts/prometheus.yaml -y

    - name: Install Grafana
      run: |
         istioctl install -f Istio-Artifacts/grafana.yaml -y

    - name: Install Kiali
      run: |
         istioctl install -f Istio-Artifacts/kiali.yaml -y

  Install-Istio-Prod:
    name: 'Verify Prod Deployment: ${{ inputs.app_name }}'
    runs-on: self-hosted
    defaults:
      run:
        shell: bash
    if: github.ref == 'refs/heads/Prod'
    environment:
     name: Prod_Env
    steps:

    - name: Download Artifacts
      uses: dawidd6/action-download-artifact@v8
      with:
        workflow: servicemesh_ci.yaml
        github_token: ${{ github.token }}
        repo: ${{ github.repository }}
        name: Istio-Artifacts
        path: Istio-Artifacts
    
    - name: Environment
      run: |
          echo "${{ vars.PROJECT_ID }}"
          echo "${{ vars.GKE_CLUSTER_NAME }}"
    
    - name: Setup Gcloud CLI
      uses: google-github-actions/setup-gcloud@94337306dda8180d967a56932ceb4ddcf01edae7
      with:
        service_account_key: ${{ secrets.GKE_SA_KEY }}
        project_id: ${{ vars.PROJECT_ID }}  

    - name: GKE-Gcloud Auth setup
      run: |
          gcloud --quiet auth configure-docker
          gcloud components install gke-gcloud-auth-plugin
          gke-gcloud-auth-plugin --version
          gcloud config set project "${{vars.PROJECT_ID}}"
          gcloud container clusters get-credentials "${{vars.GKE_CLUSTER_NAME}}" --region="${{vars.GKE_ZONE}}"

    - name: Install Istio
      run: |
          export PATH=$PWD/bin:$PATH
          istioctl install -f Istio-Artifacts/istio.yaml -y
          kubectl label namespace default istio-injection=enabled
    
    - name: Install prometheus
      run: |
         istioctl install -f Istio-Artifacts/prometheus.yaml -y

    - name: Install Grafana
      run: |
         istioctl install -f Istio-Artifacts/grafana.yaml -y

    - name: Install Kiali
      run: |
         istioctl install -f Istio-Artifacts/kiali.yaml -y
