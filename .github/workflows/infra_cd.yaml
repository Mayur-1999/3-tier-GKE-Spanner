name: 'Infrastructure CD'
on:
  workflow_dispatch:
    inputs:
      project_env:
        description: "Project Env - Dev, Test, Prod"
        required: True
        type: choice
        options:
          - Dev
          - Test
          - Prod

env:
  PROJECT_ENV: ${{ inputs.project_env }}
  TF_WORKING_DIR: ./Infrastructure-Artifacts/Env/${{ inputs.project_env }}

jobs:
  Terraform-Plan:
    name: ${{ env.PROJECT_ENV }}-Terraform-Plan
    runs-on: ubuntu-latest
    environment:
      name: ${{ env.PROJECT_ENV }}_Env
    steps:
      - name: Download Artifacts
        uses: dawidd6/action-download-artifact@v8
        with:
          workflow: infra_ci.yaml
          github_token: ${{ github.token }}
          repo: ${{ github.repository }}
          name: Infrastructure-Artifacts
          path: Infrastructure-Artifacts

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v1

      - name: Terraform Init
        run: terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.SA_KEY }}

      - name: Terraform Validate
        run: terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.SA_KEY }}

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -input=false
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.SA_KEY }}


  Terraform-Apply:
    name: ${{ env.PROJECT_ENV }}-Terraform-Apply
    runs-on: ubuntu-latest
    needs: Terraform-Plan
    environment:
      name: ${{ env.PROJECT_ENV }}_Env
    steps:
      - name: Download Artifacts
        uses: dawidd6/action-download-artifact@v8
        with:
          workflow: infra_ci.yaml
          github_token: ${{ github.token }}
          repo: ${{ github.repository }}
          name: Infrastructure-Artifacts
          path: Infrastructure-Artifacts

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v1

      - name: Terraform Init
        run: terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.SA_KEY }}

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.SA_KEY }}